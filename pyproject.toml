[project]
name = "media-grabber-bot"
version = "0.1.0"
description = "Telegram-бот: скачивание видео и аудио по ссылке (YouTube, Instagram Reels и др.)"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15",
    "yt-dlp>=2025.1.15",
    "pydantic-settings>=2.6",
    "aiohttp-socks>=0.12.0",
]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
